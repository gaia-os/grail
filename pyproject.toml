[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "grail"
version = "0.1.0"
description = "Graph Reasoning from AI Learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # torch can't handle 3.13 as of Jan 2026
authors = [
    { name = "GAIA Team" },
    { name = "Michael Walters", email = "mw@gaia-lab.de" },
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "networkx>=3.6.1",
  "pyyaml>=6.0",
  # "pymc>=5.13",
  "pyro-ppl>=1.9.1",
  "nltk>=3.9.2",
  "pydantic>=2.13",
  "sqlmodel>=0.0.42",
  "instructor>=1.16.0",
  "anthropic>=1.2.0",
  "google-genai>=2.20.0",
]

[project.optional-dependencies]
# Extra groups that can be installed with: uv pip install .[viz] (or hatch -e ...)
dev = [
  "ruff>=0.14",
  "black>=25.12",
  "pytest>=9.0",
]

all = [
  "ruff>=0.14",
  "black>=25.12",
  "pytest>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    #  { include = "grail", from = "src" }
    "src/grail",
]

[tool.uv]
# Let uv know we prefer using a managed Python 3.13 when possible.
managed = true
python-preference = "managed"

[tool.hatch.metadata]
allow-direct-references = true
