version: 1
name: health-model
metadata:
  description: A minimal causal Frame demonstrating declarative parameter references.
  tags:
    - example
    - health
variables:
  - name: ExerciseRate
    distribution: beta
    params:
      alpha: 1.0
      beta: 1.0
    description: Initial prior belief about the probability of exercising.
  - name: Exercise
    distribution: bernoulli
    params:
      theta:
        $ref: ExerciseRate
    description: Whether an individual exercises during the observation period.
  - name: Health
    distribution: normal
    params:
      loc:
        $ref: Exercise
      scale: 0.1
    description: Health outcome conditioned on exercise.
dependencies:
  - source: ExerciseRate
    target: Exercise
  - source: Exercise
    target: Health
